name: Release

# Publishes a release whenever a version tag is pushed (e.g. v0.3.0.2).
#
# TWO supported paths (they compose — pick one per release):
#   A. App Publisher GUI: bump + local build + create release + upload asset.
#      The tag it creates triggers this workflow, which rebuilds, sees the
#      asset already attached, and stands down green (idempotent step below).
#   B. Script: Installer/Release-NewVersion.ps1 -Version X (tag push only).
#      No release exists yet, so this workflow builds it and creates the
#      release with generated notes here.
#
# Either way the workflow first verifies the tag matches the csproj version
# (drift is what used to make the in-app updater loop forever).
# The app's startup updater picks the release up from there.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup 6
        run: choco install innosetup -y

      - name: Verify tag matches csproj version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v', 'V')
          $xml = [xml](Get-Content kaliteConfig.csproj)
          $ver = @($xml.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          Write-Host "Tag version: $tag; csproj version: $ver"
          if ([string]::IsNullOrWhiteSpace($ver)) { throw "Could not read <Version> from kaliteConfig.csproj." }
          if ($tag -ne $ver) {
            throw "Tag '${{ github.ref_name }}' does not match csproj <Version>$ver</Version>. " +
                  "Releasing a mismatched build makes the in-app updater loop forever — " +
                  "release via Installer/Release-NewVersion.ps1, which keeps them in lockstep."
          }

      - name: Build installer
        run: powershell -ExecutionPolicy Bypass -File Installer/Build.ps1 -Configuration Release

      # Sideload MSIX for distribution. Needs three repo secrets (Settings → Secrets → Actions):
      #   MSIX_CERT_PFX_BASE64  — base64 of the code-signing .pfx (same CN as the manifest Publisher)
      #   MSIX_CERT_PASSWORD    — password protecting that .pfx
      #   MSIX_CERT_THUMBPRINT  — hex thumbprint of the cert (also passed to local Build-MSIX.ps1 runs)
      # Skipped automatically when the secrets are absent (Inno-only release).
      - name: Build MSIX (sideload)
        if: ${{ secrets.MSIX_CERT_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          MSIX_CERT_PFX_BASE64: ${{ secrets.MSIX_CERT_PFX_BASE64 }}
          MSIX_CERT_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
          MSIX_CERT_THUMBPRINT: ${{ secrets.MSIX_CERT_THUMBPRINT }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "kaliteos-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:MSIX_CERT_PFX_BASE64))
          $secure = ConvertTo-SecureString $env:MSIX_CERT_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfx -Password $secure -CertStoreLocation Cert:\CurrentUser\My | Out-Null
          Remove-Item -LiteralPath $pfx -Force
          powershell -ExecutionPolicy Bypass -File Installer/MSIX/Build-MSIX.ps1 `
            -Configuration Release -Thumbprint $env:MSIX_CERT_THUMBPRINT
          # Export the public cert so testers can trust the publisher (Trusted People) before installing.
          $cert = Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Thumbprint -eq $env:MSIX_CERT_THUMBPRINT } | Select-Object -First 1
          if ($cert) {
            Export-Certificate -Cert $cert.PSPath -FilePath "dist/KaliteOS-Test.cer" | Out-Null
          }

      # Idempotent: never fail just because the release already exists.
      # (App Publisher creates the release + uploads its local build first;
      # the tag it made still triggers this workflow.)
      # Transitional dual-publish: Inno .exe is required, .msix + .appinstaller are uploaded when present.
      - name: Ensure GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $asset = Get-ChildItem "dist/kaliteConfig-Setup-*.exe" | Select-Object -First 1
          if (-not $asset) { throw "Build produced no dist/kaliteConfig-Setup-*.exe to publish." }
          $msix = Get-ChildItem "dist/kaliteConfig-*.msix" -ErrorAction SilentlyContinue | Select-Object -First 1
          $appinstaller = Get-ChildItem "dist/kaliteConfig.appinstaller" -ErrorAction SilentlyContinue | Select-Object -First 1
          $cer = Get-ChildItem "dist/KaliteOS-Test.cer" -ErrorAction SilentlyContinue | Select-Object -First 1
          $existing = $null
          try { $existing = gh release view "$tag" --json assets 2>$null | ConvertFrom-Json } catch { }
          if ($existing -and $existing.assets.name -contains $asset.Name) {
            Write-Host "Release $tag already carries $($asset.Name) (published via App Publisher) — uploading MSIX extras if present."
          }
          elseif ($existing) {
            Write-Host "Release $tag exists but lacks the installer — uploading $($asset.Name)..."
            gh release upload "$tag" "$($asset.FullName)" --clobber
          } else {
            Write-Host "Creating release $tag with $($asset.Name)..."
            gh release create "$tag" --title "$tag" --generate-notes "$($asset.FullName)"
          }
          foreach ($extra in @($msix, $appinstaller, $cer) | Where-Object { $_ }) {
            Write-Host "Uploading $($extra.Name)..."
            gh release upload "$tag" "$($extra.FullName)" --clobber
          }
